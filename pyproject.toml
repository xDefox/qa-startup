[project]
name = "webscope"
version = "0.3.1"
description = "Deterministic web QA engine with a CLI, MCP server and CI-friendly output"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "playwright>=1.49.0",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17,<0.18",
    # нужен тестам шифрования паролей (WEBSCOPE_AUTH_KEY)
    "cryptography>=43",
    # для джобы `security` в .github/workflows/ci.yml
    "pip-audit>=2.7",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # формы FastAPI (Form/File) не работают без python-multipart;
    # cryptography — шифрование паролей к защищённым сайтам
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "stripe>=8.0.0",
]

[project.scripts]
webscope = "webscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["webscope*"]

[tool.setuptools.package-dir]
src = "src"

[tool.setuptools.package-data]
webscope = ["vendor/*.js"]
# Без static/* установленный пакет (Docker, `pip install .`) падает на старте:
# FastAPI/Starlette ищет webapp/static рядом с установленным app.py.
"webscope.webapp" = [
    "templates/*.html",
    "static/*.svg",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Старый генератор презентации оставлен только для истории, не используется.
extend-exclude = ["pitch/build_deck_v1.py"]

[tool.ruff.lint.per-file-ignores]
# File(...)/Form(...)/Depends(...) в дефолтах — идиоматичный FastAPI-паттерн
"src/webscope/webapp/app.py" = ["B008"]
"src/webscope/webapp/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: тесты, требующие установленного браузера (Playwright Chromium)",
    "e2e: end-to-end тесты с Playwright (требуют запущенного сервера)",
]
