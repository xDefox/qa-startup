[project]
name = "webscope"
version = "0.3.0"
description = "Deterministic web QA engine with a CLI, MCP server and CI-friendly output"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17,<0.18",
    # нужен тестам шифрования паролей (WEBSCOPE_AUTH_KEY)
    "cryptography>=43",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # формы FastAPI (Form/File) не работают без python-multipart;
    # cryptography — шифрование паролей к защищённым сайтам
    "python-multipart>=0.0.9",
    "cryptography>=43",
]

[project.scripts]
webscope = "webscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["webscope*"]

[tool.setuptools.package-data]
webscope = ["vendor/*.js"]
"webscope.webapp" = ["templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# File(...)/Form(...) в дефолтах — идиоматичный FastAPI-паттерн
"src/webscope/webapp/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: тесты, требующие установленного браузера (Playwright Chromium)",
]
