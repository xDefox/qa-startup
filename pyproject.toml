[project]
name = "webscope"
version = "0.1.0"
description = "Deterministic web QA engine with a CLI, MCP server and CI-friendly output"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17,<0.18",
]

[project.scripts]
webscope = "webscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["webscope*"]

[tool.setuptools.package-data]
webscope = ["vendor/*.js"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: тесты, требующие установленного браузера (Playwright Chromium)",
]
