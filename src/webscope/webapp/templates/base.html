<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<title>{% block title %}webscope — проверка сайта{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1c2333;
    --muted: #5b6474;
    --line: #e4e7ec;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --critical: #b42318;
    --serious: #d97706;
    --serious-ink: #92400e;
    --moderate: #b54708;
    --minor: #667085;
    --ok: #087443;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b1026;
    --card: #101625;
    --ink: #e6e8ee;
    --muted: #9aa2b4;
    --line: #232a3d;
    --accent: #4f9bff;
    --accent-hover: #6aa8ff;
    --critical: #f87171;
    --serious: #f59e0b;
    --serious-ink: #f59e0b;
    --moderate: #f59e0b;
    --minor: #9aa2b4;
    --ok: #22c55e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1026;
      --card: #101625;
      --ink: #e6e8ee;
      --muted: #9aa2b4;
      --line: #232a3d;
      --accent: #4f9bff;
      --accent-hover: #6aa8ff;
      --critical: #f87171;
      --serious: #f59e0b;
      --serious-ink: #f59e0b;
      --moderate: #f59e0b;
      --minor: #9aa2b4;
      --ok: #22c55e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent-hover); }
  .top {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .top .logo { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .top .logo a { color: var(--ink); text-decoration: none; }
  .top .logo a:hover { color: var(--ink); }
  .top .logo span { color: var(--accent); }
  .top-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top-actions .pill { font-size: 13px; }
  .top .theme-toggle {
    margin-left: 0;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 38px;
    height: 38px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
  }
  .top .theme-toggle:hover { color: var(--ink); background: var(--card); }
  .top .theme-toggle:active { transform: scale(0.98); }
  .theme-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    transition: transform 320ms ease, opacity 160ms ease;
  }
  .theme-icon svg { width: 18px; height: 18px; display: block; }
  html.theme-transition *,
  html.theme-transition *:before,
  html.theme-transition *:after {
    transition: background-color 240ms ease, color 240ms ease, border-color 240ms ease, fill 240ms ease, stroke 240ms ease !important;
    transition-delay: 0s !important;
  }
  main { max-width: 1600px; margin: 0 auto; padding: 28px 24px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0 1px 1px rgba(15, 23, 42, 0.01), 0 10px 30px -20px rgba(15, 23, 42, 0.8);
  }
  h1 { font-size: 30px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
  h2 { font-size: 21px; letter-spacing: -0.01em; margin: 0 0 14px; text-wrap: balance; }
  h3 { font-size: 16px; margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  input[type=text], input[type=email], input[type=password], select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 16px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input:focus:not(:focus-visible), select:focus:not(:focus-visible), button:focus:not(:focus-visible), a:focus:not(:focus-visible) {
    outline: none;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  button, .btn-like {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 120ms ease-in-out;
    touch-action: manipulation;
    text-decoration: none;
    font-family: inherit;
  }
  button:hover, .btn-like:hover { background: var(--accent-hover); color: #fff; }
  button:active, .btn-like:active { background: #1e40af; }
  button.secondary, .btn-like.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  button.secondary:hover, .btn-like.secondary:hover { background: var(--bg); color: var(--ink); }
  button.danger { background: var(--card); color: #b42318; border: 1px solid #f2b8b5; }
  button.danger:hover { background: #fee4e2; color: #b42318; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1 1 180px; }
  .row > .actions { flex: 0 0 auto; }
  /* Карточка со скачиванием: кнопки-форматы одной строкой, без растягивания. */
  .download-card h2 { margin-bottom: 6px; }
  .download-card p { margin-top: 0; }
  .download-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .download-row .pill { border: 1px solid var(--line); background: transparent; }
  .download-row .pill:hover { background: var(--bg); }
  .check-row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 12px;
    user-select: none;
  }
  .check-row input[type=checkbox] {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .auth-block {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: color-mix(in srgb, var(--card) 88%, var(--bg));
    padding: 16px;
    margin-bottom: 14px;
  }
  .auth-block[hidden], .check-row[hidden] { display: none; }
  .error {
    background: color-mix(in srgb, var(--card) 92%, #fee2e2);
    border: 1px solid rgba(248, 113, 113, 0.5);
    color: var(--critical);
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .hero { text-align: center; padding: 40px 24px 34px; }
  .hero p { max-width: 560px; margin: 0 auto 22px; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 18px; }
  .step { background: var(--bg); border-radius: 12px; padding: 16px; }
  .step b { display: block; margin-bottom: 4px; }
  .score {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .score small { font-size: 18px; font-weight: 500; color: var(--muted); }
  /* Прошлый балл «заклеен»: перечёркнут насквозь и припечатан полоской-скотчем. */
  .score-prev {
    position: relative;
    font-size: 26px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 3px;
    text-decoration-color: currentColor;
    opacity: 0.75;
    margin-right: 2px;
  }
  .score-prev::after {
    content: "";
    position: absolute;
    left: -3px;
    right: -3px;
    top: 52%;
    height: 7px;
    background: color-mix(in srgb, var(--muted) 26%, transparent);
    border-radius: 2px;
    transform: rotate(-2deg);
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  /* Бейджи: светлые фоны фиксированы, поэтому и текст — фиксированный тёмный
     (в тёмной теме светлая «табличка» с тёмным текстом читается нормально,
     а темовые светлые цвета на светлом фоне проваливали контраст). */
  .badge.critical { background: #fee4e2; color: #b42318; }
  .badge.serious { background: #fef0c7; color: #92400e; }
  .badge.moderate { background: #fdf1e3; color: #9a3412; }
  .badge.minor { background: #f2f4f7; color: #475467; }
  .badge.ok { background: #dcfae6; color: #087443; }
  .badge.external { background: #eef2f6; color: #475467; }
  .sev { border-left: 4px solid var(--line); padding-left: 14px; margin-bottom: 18px; }
  .sev.critical { border-color: var(--critical); }
  .sev.serious { border-color: var(--serious); }
  .sev.moderate { border-color: var(--moderate); }
  .sev.minor { border-color: var(--minor); }
  .sev.external { border-color: var(--line); }

  /* Все находки: таблица/список. Переключатель — иконки в стиле кнопки темы:
     без текста, тот же размер, тот же радиус, то же поведение при наведении. */
  .findings-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .view-toggle { margin-left: auto; display: inline-flex; gap: 6px; }
  .view-btn {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 38px;
    height: 38px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
  }
  .view-btn:hover { color: var(--ink); }
  .view-btn:active { transform: scale(0.98); }
  .view-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view-btn svg { width: 18px; height: 18px; display: block; }
  .view-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
  .findings-view[hidden] { display: none; }
  .findings-table-wrap { overflow-x: auto; }
  .findings-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .findings-table th {
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
    background: var(--bg);
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
  }
  .findings-table td { border-bottom: 1px solid var(--line); padding: 10px 12px; vertical-align: top; color: var(--ink); }
  .findings-table tbody tr:hover { background: var(--bg); }
  .findings-table .cell-rule { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .findings-table .cell-num { text-align: right; white-space: nowrap; }
  .findings-table .cell-selector code { font-size: 12.5px; word-break: break-all; }
  .findings-table .cell-url { color: var(--muted); font-size: 13px; word-break: break-all; max-width: 150px; }
  .findings-table .cell-title, .findings-table .cell-fix { max-width: 320px; }
  /* Широкий экран: фиксированные колонки. Селектор и инструкция — основной
     текст, им большая доля; счётчики и URL узкие, они не несут длинного текста. */
  @media (min-width: 1280px) {
    .findings-table { table-layout: fixed; }
    .findings-table .col-rule { width: 12%; }
    .findings-table .col-severity { width: 9%; }
    .findings-table .col-title { width: 17%; }
    .findings-table .col-pages { width: 5%; }
    .findings-table .col-count { width: 6%; }
    .findings-table .col-selector { width: 24%; }
    .findings-table .col-fix { width: 19%; }
    .findings-table .col-url { width: 8%; }
    .findings-table .cell-rule { white-space: normal; overflow-wrap: anywhere; }
    .findings-table .cell-title, .findings-table .cell-fix, .findings-table .cell-url { max-width: none; }
  }
  @media (max-width: 760px) {
    .findings-table .cell-selector, .findings-table .cell-url { display: none; }
    .findings-table th:nth-child(6), .findings-table th:nth-child(8) { display: none; }
  }
  .issue { margin-bottom: 14px; }
  .issue .fix { color: var(--muted); font-size: 14px; }
  .issue .where { font-size: 13px; color: var(--muted); word-break: break-all; }
  .issue code { background: var(--bg); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .issue pre.snippet {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 12.5px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .card.blockers { border-color: rgba(248, 113, 113, 0.5); background: color-mix(in srgb, var(--card) 92%, #fee2e2); }
  .card.blockers h2 { color: var(--critical); }
  .note-context { margin-top: 8px; font-size: 13px; color: var(--serious-ink); background: color-mix(in srgb, var(--card) 92%, #f59e0b); border: 1px solid color-mix(in srgb, var(--line) 70%, #f59e0b); border-radius: 8px; padding: 8px 10px; }
  ol.actions-list { margin: 0; padding-left: 22px; }
  ol.actions-list li { margin-bottom: 12px; }
  .diff-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .site-rows { display: flex; flex-direction: column; }
  .site-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
  }
  .site-row:last-child { border-bottom: 0; }
  .site-row:hover { color: var(--ink); }
  .site-row:hover .site-row-url { text-decoration: underline; text-underline-offset: 3px; }
  .site-row-main { min-width: 0; }
  .site-row-url { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-row-meta { margin-top: 2px; }
  .site-row-score { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .site-row-arrow { font-size: 18px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 20px 40px; }
  .pill { display: inline-block; background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .flash { background: color-mix(in srgb, var(--card) 92%, #3b82f6); border: 1px solid color-mix(in srgb, var(--line) 70%, #3b82f6); color: var(--accent); padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }

  /* «Идёт проверка»: бегущая строка-полоска и вращающийся кружок. */
  .scan-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    background: color-mix(in srgb, var(--card) 92%, #3b82f6);
    border: 1px solid color-mix(in srgb, var(--line) 70%, #3b82f6);
    color: var(--accent);
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
    position: relative;
  }
  .scan-spinner {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: scan-spin 0.8s linear infinite;
  }
  .scan-progress-text { flex: 1 1 auto; }
  /* Бегущая полоска внизу блока: indeterminate progress bar. */
  .scan-progress::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 40%;
    background: var(--accent);
    border-radius: 3px;
    animation: scan-run 1.4s ease-in-out infinite;
  }
  @keyframes scan-spin { to { transform: rotate(360deg); } }
  @keyframes scan-run {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scan-spinner, .scan-progress::after { animation-duration: 2.4s; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><a href="/">webscope<span>.</span></a></div>
  <div class="top-actions">
    {% if auth_enabled %}
    <a class="pill" href="/auth/logout">Выйти</a>
    {% endif %}
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Сменить тему">
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  Проверка автоматическая: она находит типовые проблемы доступности, работоспособности
  и удобства на телефоне, но не заменяет проверку человеком.
</footer>
<script>
  (function(){
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const icon = btn?.querySelector('.theme-icon');
    const key = 'webscope-theme';
    const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.93 4.93l1.41 1.41"></path><path d="M17.66 17.66l1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M6.34 17.66l-1.41 1.41"></path><path d="M19.07 4.93l-1.41 1.41"></path></svg>';
    const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    function currentIsDark(){
      if(root.getAttribute('data-theme') === 'dark') return true;
      if(root.getAttribute('data-theme') === 'light') return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function applyTheme(isDark){
      root.classList.add('theme-transition');
      if(isDark) root.setAttribute('data-theme','dark');
      else root.setAttribute('data-theme','light');
      if(icon){
        icon.innerHTML = isDark ? moon : sun;
        icon.style.transform = isDark ? 'rotate(-20deg)' : 'rotate(0deg)';
      }
      btn?.setAttribute('aria-label', isDark ? 'Тёмная тема' : 'Светлая тема');
      setTimeout(function(){ root.classList.remove('theme-transition'); }, 260);
    }
    let isDark = localStorage.getItem(key) === 'dark' || (localStorage.getItem(key) !== 'light' && currentIsDark());
    applyTheme(isDark);
    btn?.addEventListener('click', function(){
      isDark = !isDark;
      localStorage.setItem(key, isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
