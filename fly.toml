# fly.toml - Fly.io deployment config for WebScope
app = "webscope"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

[env]
  PORT = "8080"
  WEBSCOPE_HOST = "0.0.0.0"
  WEBSCOPE_PORT = "8080"
  # База на постоянном диске (см. [[mounts]]), иначе данные теряются при деплое.
  WEBSCOPE_DB_PATH = "/data/webscope.db"

[[mounts]]
  source = "webscope_data"
  destination = "/data"

[[vm]]
  # Сканер держит Chromium; на 512 МБ рендерер падает по памяти.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1