# fly.toml app configuration file generated for webscope on 2026-11-18T22:12:40Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'webscope'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  WEBSCOPE_HOST = '0.0.0.0'
  WEBSCOPE_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
